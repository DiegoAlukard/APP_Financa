<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Controle Financeiro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        html, body {
            touch-action: pan-x pan-y;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }
        .draggable-row {
            cursor: grab;
        }
        .draggable-row:active {
            cursor: grabbing;
        }
        .drag-over {
            border-top: 2px dashed #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center h-[100dvh] w-screen overflow-hidden sm:p-2 select-none">

    <!-- TELA DE BLOQUEIO POR SENHA -->
    <div id="tela-bloqueio" class="fixed inset-0 z-50 bg-slate-950 flex justify-center items-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 space-y-5 text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-emerald-400 text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-100">Controle Financeiro</h1>
                <p class="text-sm text-slate-400 mt-1">Digite a senha de acesso</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="input-senha-acesso" inputmode="numeric" maxlength="10" placeholder="••••••" onkeydown="if(event.key==='Enter') verificarSenhaAcesso()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-center text-2xl tracking-[0.4em] font-bold text-slate-100 focus:outline-none focus:border-blue-500">
                <p id="msg-erro-senha" class="text-sm text-rose-400 font-medium hidden">Senha incorreta. Tente novamente.</p>
                <button onclick="verificarSenhaAcesso()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-base transition shadow-lg shadow-blue-600/20 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-unlock-keyhole"></i> <span>Desbloquear</span>
                </button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md bg-slate-900 sm:border sm:border-slate-800 sm:rounded-2xl shadow-2xl flex flex-col h-full sm:h-[820px] sm:max-h-[96dvh] overflow-hidden">
        
        <!-- Bloco de Topo FIXO: Mês e Resumo -->
        <div class="shrink-0 p-4 border-b border-slate-800 bg-slate-900">
            <div class="flex items-center justify-center space-x-2 mb-3">
                <!-- Botão de Reordenar à esquerda do Mês -->
                <button onclick="alternarModoReordenar()" id="btn-toggle-reordenar" title="Reordenar Tabela" class="bg-slate-800 hover:bg-slate-700 text-slate-300 w-10 h-10 rounded-xl font-bold flex items-center justify-center transition shadow-md cursor-pointer">
                    <i class="fa-solid fa-arrow-up-wide-short text-sm"></i>
                </button>
                <label for="dd-mes" class="text-base font-bold text-slate-300">Mês:</label>
                <select id="dd-mes" onchange="mudarMes(this.value)" class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-base text-slate-100 font-bold focus:outline-none focus:border-blue-500 shadow-md cursor-pointer text-center">
                </select>
                <!-- Botão + em verde para aba de Investimentos -->
                <button onclick="abrirInvestimentos()" title="Gerenciar Investimentos" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-xl font-bold flex items-center justify-center transition shadow-md cursor-pointer">
                    <i class="fa-solid fa-plus text-base"></i>
                </button>
            </div>
            
            <!-- Resumo Dinâmico (Finanças ou Investimentos) -->
            <div id="bloco-resumo-topo" class="space-y-1.5 text-base bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                <div id="txt-receitas" class="text-emerald-400 font-medium flex justify-between"><span>Receitas:</span> <span class="font-bold">R$ 0,00</span></div>
                <div id="txt-despesas" class="text-rose-400 font-medium flex justify-between"><span>Despesas:</span> <span class="font-bold">R$ 0,00</span></div>
                <div id="txt-saldo" class="text-lg font-bold text-cyan-300 pt-1.5 border-t border-slate-800 flex justify-between"><span>Saldo:</span> <span class="font-bold">R$ 0,00</span></div>
            </div>
        </div>

        <!-- Corpo Central ROLÁVEL (Abas Dinâmicas) -->
        <div id="corpo-central" class="flex-1 overflow-y-auto overflow-x-hidden p-4 space-y-3">
        </div>

        <!-- Bloco Inferior FIXO: Avisos + Menu -->
        <div class="shrink-0 bg-slate-900 border-t border-slate-800">
            <div class="px-4 py-2.5 bg-slate-950/90 border-b border-slate-800 flex items-center space-x-2 text-sm text-amber-300">
                <i class="fa-solid fa-circle-info shrink-0 text-base"></i>
                <span id="txt-aviso" class="truncate font-medium">Conectando ao Firebase (Tempo Real)...</span>
            </div>

            <div class="grid grid-cols-3 gap-2 p-3">
                <button onclick="acaoBotaoEsquerdo()" id="btn-tab-principal" class="bg-blue-600 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-house text-sm"></i> <span>Principal</span>
                </button>
                <button onclick="acaoBotaoCentral()" id="btn-tab-adicionar" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-plus text-sm"></i> <span>Adicionar</span>
                </button>
                <button onclick="acaoBotaoDireito()" id="btn-tab-configurar" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-gear text-sm"></i> <span>Configurar</span>
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const SENHA_PADRAO = "301521";
        const CHAVE_AUTH = "app_financa_ultimo_acesso";
        const UMA_SEMANA_MS = 7 * 24 * 60 * 60 * 1000;

        (function(){
            emailjs.init("service_default_id_placeholder");
        })();

        function enviarAlertaEmailErro() {
            const dataHora = new Date().toLocaleString('pt-BR');
            emailjs.send("default_service", "template_default", {
                to_email: "diegofso10@hotmail.com",
                message: `Tentativa de acesso não autorizada detectada em ${dataHora}.`
            }).catch(() => {});
        }

        function checarAcesso() {
            const ultimoAcesso = localStorage.getItem(CHAVE_AUTH);
            const agora = Date.now();
            const telaBloqueio = document.getElementById("tela-bloqueio");

            if (ultimoAcesso && (agora - parseInt(ultimoAcesso, 10)) < UMA_SEMANA_MS) {
                telaBloqueio.classList.add("hidden");
            } else {
                telaBloqueio.classList.remove("hidden");
                setTimeout(() => document.getElementById("input-senha-acesso")?.focus(), 100);
            }
        }

        window.verificarSenhaAcesso = function() {
            const input = document.getElementById("input-senha-acesso");
            const erro = document.getElementById("msg-erro-senha");
            if (input.value === SENHA_PADRAO) {
                localStorage.setItem(CHAVE_AUTH, String(Date.now()));
                input.value = "";
                erro.classList.add("hidden");
                document.getElementById("tela-bloqueio").classList.add("hidden");
            } else {
                enviarAlertaEmailErro();
                erro.classList.remove("hidden");
                input.value = "";
                input.focus();
            }
        }

        window.bloquearAppAgora = function() {
            localStorage.removeItem(CHAVE_AUTH);
            checarAcesso();
        }

        checarAcesso();

        document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
        });
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        const firebaseConfig = {
            apiKey: "AIzaSyDgrKwRpOZbuLe_FjYbXSjCcHVOVa7disY",
            authDomain: "appfinanca-2e028.firebaseapp.com",
            projectId: "appfinanca-2e028",
            storageBucket: "appfinanca-2e028.appfirebasestorage.app",
            messagingSenderId: "734956292325",
            appId: "1:734956292325:web:738e071aedb0b8c312ac0c",
            measurementId: "G-Q8C43YLS8H"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        let lancamentos = [];
        let investimentos = [];
        let backupsNuvem = [];
        const dataHoje = new Date();
        let mesAtual = `${dataHoje.getFullYear()}-${String(dataHoje.getMonth() + 1).padStart(2, '0')}`;
        let abaAtiva = "principal"; // "principal", "adicionar", "configurar", "investimentos", "adicionar_investimento", "reordenar"
        
        let itemSelecionado = null;
        let itemInvestimentoSelecionado = null;
        let modoEdicaoId = null;
        let modoEdicaoInvestimentoId = null;
        let pressTimer = null;
        let deferredPrompt = null;

        let indiceArrastando = null;

        function avisar(msg, erro = false) {
            const aviso = document.getElementById("txt-aviso");
            if (!aviso) return;
            aviso.textContent = msg;
            aviso.title = msg;
            aviso.className = erro ? "truncate font-medium text-rose-400" : "truncate font-medium text-amber-300";
        }

        window.formatarValorTabela = function(val) {
            const num = parseFloat(val) || 0;
            const isInteiro = Math.abs(num % 1) < 0.001;
            return num.toLocaleString('pt-BR', {
                minimumFractionDigits: isInteiro ? 0 : 2,
                maximumFractionDigits: 2
            });
        }

        window.formatardataIsoBr = function(isoStr) {
            if (!isoStr) return "";
            const [ano, mes, diaHora] = isoStr.split("-");
            const [dia] = (diaHora || "").split("T");
            return `${dia}/${mes}/${ano}`;
        }

        window.formatarMesBr = function(ym) {
            if (!ym || !ym.includes("-")) return ym;
            const [ano, mes] = ym.split("-");
            return `${mes}-${ano}`;
        }

        window.formatarMesIso = function(br) {
            if (!br || !br.includes("-")) return br;
            const [mes, ano] = br.split("-");
            return `${ano}-${mes}`;
        }

        window.obterItensDoMes = function(ym) {
            let itens = lancamentos.filter(l => {
                if (l.fixo === 1 || l.fixo === true) {
                    return l.ano_mes <= ym;
                }
                return l.ano_mes === ym;
            });

            itens.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            return itens;
        }

        window.gerarListaMeses = function() {
            const anoAtual = new Date().getFullYear();
            let meses = [];
            for (let ano = anoAtual - 1; ano <= anoAtual + 2; ano++) {
                for (let mes = 1; mes <= 12; mes++) {
                    meses.push(`${ano}-${String(mes).padStart(2, '0')}`);
                }
            }
            lancamentos.forEach(l => { if (l.ano_mes) meses.push(l.ano_mes); });
            return [...new Set(meses)].sort().reverse();
        }

        window.atualizarOpcoesMeses = function() {
            const select = document.getElementById("dd-mes");
            if (!select) return;
            const meses = gerarListaMeses();
            if (!meses.includes(mesAtual)) meses.unshift(mesAtual);

            select.innerHTML = "";
            meses.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m;
                opt.textContent = formatarMesBr(m);
                if (m === mesAtual) opt.selected = true;
                select.appendChild(opt);
            });
        }

        window.popularSelectMesInicio = function(idSelect, mesSelecionadoDefault = mesAtual) {
            const select = document.getElementById(idSelect);
            if (!select) return;
            const meses = gerarListaMeses();
            if (!meses.includes(mesSelecionadoDefault)) meses.unshift(mesSelecionadoDefault);

            select.innerHTML = "";
            meses.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m;
                opt.textContent = formatarMesBr(m);
                if (m === mesSelecionadoDefault) opt.selected = true;
                select.appendChild(opt);
            });
        }

        window.mudarMes = function(novoMes) {
            itemSelecionado = null;
            itemInvestimentoSelecionado = null;
            mesAtual = novoMes;
            renderizarTela();
        }

        window.abrirInvestimentos = function() {
            itemSelecionado = null;
            itemInvestimentoSelecionado = null;
            modoEdicaoInvestimentoId = null;
            abaAtiva = "investimentos";
            renderizarTela();
        }

        window.alternarModoReordenar = function() {
            if (abaAtiva === "reordenar") {
                abaAtiva = "principal";
            } else {
                itemSelecionado = null;
                abaAtiva = "reordenar";
            }
            renderizarTela();
        }

        // Funções de Drag and Drop Nativo
        window.aoIniciarArrasto = function(e, index) {
            indiceArrastando = index;
            e.dataTransfer.effectAllowed = 'move';
        }

        window.aoSobreporArrasto = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const tr = e.currentTarget;
            tr.classList.add('drag-over');
        }

        window.aoSairArrasto = function(e) {
            const tr = e.currentTarget;
            tr.classList.remove('drag-over');
        }

        window.aoSoltarItem = function(e, indexDestino) {
            e.preventDefault();
            const tr = e.currentTarget;
            tr.classList.remove('drag-over');

            if (indiceArrastando === null || indiceArrastando === indexDestino) return;

            const itensMes = obterItensDoMes(mesAtual);
            const itemMovido = itensMes.splice(indiceArrastando, 1)[0];
            itensMes.splice(indexDestino, 0, itemMovido);

            itensMes.forEach((item, idx) => {
                item.ordemTemp = idx;
            });

            indiceArrastando = null;
            renderizarTela();
        }

        window.salvarReordenacao = async function() {
            try {
                const itensMes = obterItensDoMes(mesAtual);
                for (let i = 0; i < itensMes.length; i++) {
                    const item = itensMes[i];
                    const novaOrdem = (item.ordemTemp !== undefined) ? item.ordemTemp : i;
                    await updateDoc(doc(db, "lancamentos", item.firestoreId), {
                        ordem: novaOrdem
                    });
                }
                avisar("Nova ordem salva com sucesso!");
                abaAtiva = "principal";
                renderizarTela();
            } catch (e) {
                console.error("Erro ao salvar ordem:", e);
                avisar("Erro ao salvar nova ordem.", true);
            }
        }

        window.atualizarResumo = function() {
            const blocoResumo = document.getElementById("bloco-resumo-topo");
            const btnReordenar = document.getElementById("btn-toggle-reordenar");
            if (!blocoResumo) return;

            if (btnReordenar) {
                if (abaAtiva === "investimentos" || abaAtiva === "adicionar_investimento") {
                    btnReordenar.classList.add("hidden");
                } else {
                    btnReordenar.classList.remove("hidden");
                    if (abaAtiva === "reordenar") {
                        btnReordenar.className = "bg-blue-600 text-white w-10 h-10 rounded-xl font-bold flex items-center justify-center transition shadow-md cursor-pointer";
                    } else {
                        btnReordenar.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 w-10 h-10 rounded-xl font-bold flex items-center justify-center transition shadow-md cursor-pointer";
                    }
                }
            }

            if (abaAtiva === "investimentos" || abaAtiva === "adicionar_investimento") {
                const totalInvestido = investimentos.reduce((acc, inv) => acc + (parseFloat(inv.valor) || 0), 0);
                blocoResumo.innerHTML = `
                    <div class="text-cyan-300 font-medium flex justify-between"><span>Total em Investimentos:</span> <span class="font-bold">R$ ${totalInvestido.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span></div>
                    <div class="text-xs text-slate-400 pt-1 border-t border-slate-800 flex justify-between"><span>Ativos cadastrados:</span> <span class="font-bold">${investimentos.length}</span></div>
                `;
            } else {
                const itensMes = obterItensDoMes(mesAtual);
                
                let receitasGeral = 0;
                let despesasGeral = 0;
                let receitasVale = 0;
                let despesasVale = 0;

                itensMes.forEach(l => {
                    const valor = parseFloat(l.valor) || 0;
                    const descLower = String(l.descricao || "").toLowerCase();
                    const isVale = l.forma_pagamento === "Vale" || descLower.includes("vale");

                    if (l.tipo === "Receita") {
                        receitasGeral += valor;
                        if (isVale) receitasVale += valor;
                    } else {
                        despesasGeral += valor;
                        if (isVale) despesasVale += valor;
                    }
                });

                const saldoGeral = receitasGeral - despesasGeral;
                const saldoVale = receitasVale - despesasVale;

                const txtReceitas = `R$ ${receitasGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})} - R$ ${receitasVale.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                const txtDespesas = `R$ ${despesasGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})} - R$ ${despesasVale.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                const txtSaldo = `R$ ${saldoGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})} - R$ ${saldoVale.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

                blocoResumo.innerHTML = `
                    <div id="txt-receitas" class="text-emerald-400 font-medium flex justify-between"><span>Receitas:</span> <span class="font-bold">${txtReceitas}</span></div>
                    <div id="txt-despesas" class="text-rose-400 font-medium flex justify-between"><span>Despesas:</span> <span class="font-bold">${txtDespesas}</span></div>
                    <div id="txt-saldo" class="text-lg font-bold ${saldoGeral >= 0 ? 'text-cyan-300' : 'text-rose-400'} pt-1.5 border-t border-slate-800 flex justify-between"><span>Saldo:</span> <span class="font-bold">${txtSaldo}</span></div>
                `;
            }
        }

        window.acaoBotaoEsquerdo = function() {
            if (itemSelecionado || itemInvestimentoSelecionado) {
                itemSelecionado = null;
                itemInvestimentoSelecionado = null;
                avisar("Ação cancelada.");
                renderizarTela();
            } else if (abaAtiva === "adicionar" || abaAtiva === "adicionar_investimento" || abaAtiva === "reordenar") {
                modoEdicaoId = null;
                modoEdicaoInvestimentoId = null;
                avisar("Ação cancelada.");
                if (abaAtiva === "adicionar_investimento") abaAtiva = "investimentos";
                else abaAtiva = "principal";
                renderizarTela();
            } else if (abaAtiva === "investimentos") {
                abaAtiva = "principal";
                renderizarTela();
            } else {
                mudarAba("principal");
            }
        }

        window.acaoBotaoCentral = function() {
            if (itemSelecionado) {
                confirmarExclusaoItem();
            } else if (itemInvestimentoSelecionado) {
                confirmarExclusaoInvestimento();
            } else if (abaAtiva === "reordenar") {
                salvarReordenacao();
            } else if (abaAtiva === "adicionar") {
                salvarLancamento();
            } else if (abaAtiva === "adicionar_investimento") {
                salvarInvestimento();
            } else if (abaAtiva === "investimentos") {
                modoEdicaoInvestimentoId = null;
                abaAtiva = "adicionar_investimento";
                renderizarTela();
            } else {
                modoEdicaoId = null;
                mudarAba("adicionar");
            }
        }

        window.acaoBotaoDireito = function() {
            if (itemSelecionado) {
                prepararEdicaoItem();
            } else if (itemInvestimentoSelecionado) {
                prepararEdicaoInvestimento();
            } else if (abaAtiva === "investimentos") {
                abaAtiva = "principal";
                renderizarTela();
            } else {
                mudarAba('configurar');
            }
        }

        window.atualizarBotoesMenu = function() {
            const btnEsq = document.getElementById("btn-tab-principal");
            const btnCen = document.getElementById("btn-tab-adicionar");
            const btnDir = document.getElementById("btn-tab-configurar");
            if (!btnEsq || !btnCen || !btnDir) return;

            if (itemSelecionado || itemInvestimentoSelecionado) {
                btnEsq.className = "bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md";
                btnEsq.innerHTML = `<i class="fa-solid fa-xmark text-sm"></i> <span>Cancelar</span>`;

                btnCen.className = "bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md";
                btnCen.innerHTML = `<i class="fa-solid fa-trash text-sm"></i> <span>Excluir</span>`;

                btnDir.className = "bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md";
                btnDir.innerHTML = `<i class="fa-solid fa-pen text-sm"></i> <span>Editar</span>`;
            } else if (abaAtiva === "reordenar") {
                btnEsq.className = "bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md";
                btnEsq.innerHTML = `<i class="fa-solid fa-xmark text-sm"></i> <span>Cancelar</span>`;

                btnCen.className = "bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5 shadow-md";
                btnCen.innerHTML = `<i class="fa-solid fa-check text-sm"></i> <span>Confirmar</span>`;

                btnDir.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm font-bold transition flex items-center justify-center space-x-1.5";
                btnDir.innerHTML = `<i class="fa-solid fa-gear text-sm"></i> <span>Configurar</span>`;
            } else if (abaAtiva === "adicionar" || abaAtiva === "adicionar_investimento") {

        function somarMeses(ym, adicionar) {
            const [anoStr, mesStr] = ym.split("-");
            const data = new Date(parseInt(anoStr, 10), parseInt(mesStr, 10) - 1 + adicionar, 1);
            return `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, '0')}`;
        }

        window.salvarLancamento = async function() {
            const tipo = document.getElementById("add-tipo").value;
            const desc = document.getElementById("add-desc").value.trim();
            const valorStr = document.getElementById("add-valor").value.replace(",", ".");
            const modo = document.getElementById("add-modo").value;

            if (!desc || !valorStr) {
                avisar("Preencha descrição e valor.", true);
                return;
            }

            const valor = parseFloat(valorStr);
            const formaPagamento = document.getElementById("add-forma").value;
            const pago = tipo === "Despesa" && document.getElementById("add-pago").checked ? 1 : 0;
            const mesBase = (formaPagamento === "Crédito") ? document.getElementById("add-mes-credito").value : mesAtual;

            try {
                const itensAtuais = obterItensDoMes(mesBase);
                const proximaOrdem = itensAtuais.length > 0 ? Math.max(...itensAtuais.map(i => i.ordem || 0)) + 1 : 0;

                if (modoEdicaoId) {
                    await updateDoc(doc(db, "lancamentos", modoEdicaoId), {
                        tipo,
                        descricao: desc,
                        valor,
                        forma_pagamento: formaPagamento,
                        pago
                    });
                    modoEdicaoId = null;
                    avisar("Lançamento atualizado!");
                } else if (modo === "avulso") {
                    await addDoc(collection(db, "lancamentos"), {
                        ano_mes: mesBase,
                        tipo,
                        descricao: desc,
                        valor,
                        fixo: 0,
                        forma_pagamento: formaPagamento,
                        pago,
                        ordem: proximaOrdem
                    });
                    avisar("Lançamento salvo!");
                } else if (modo === "parcelado") {
                    const qtdParcelas = Math.max(2, parseInt(document.getElementById("add-parcelas").value, 10) || 2);
                    for (let i = 0; i < qtdParcelas; i++) {
                        const ym = somarMeses(mesBase, i);
                        await addDoc(collection(db, "lancamentos"), {
                            ano_mes: ym,
                            tipo,
                            descricao: `${desc} (${i + 1}/${qtdParcelas})`,
                            valor,
                            fixo: 0,
                            forma_pagamento: formaPagamento,
                            pago: i === 0 ? pago : 0,
                            ordem: proximaOrdem + i
                        });
                    }
                    avisar("Lançamento salvo!");
                } else if (modo === "fixo") {
                    await addDoc(collection(db, "lancamentos"), {
                        ano_mes: mesBase,
                        tipo,
                        descricao: desc,
                        valor,
                        fixo: 1,
                        forma_pagamento: formaPagamento,
                        pago,
                        ordem: proximaOrdem
                    });
                    avisar("Lançamento salvo!");
                }
                mudarAba("principal");
            } catch (e) {
                console.error("Erro ao salvar:", e);
                avisar(`Erro ao salvar (${e.code}).`, true);
            }
        }

        window.salvarInvestimento = async function() {
            const desc = document.getElementById("inv-desc").value.trim();
            const valorStr = document.getElementById("inv-valor").value.replace(",", ".");

            if (!desc || !valorStr) {
                avisar("Preencha descrição e valor do investimento.", true);
                return;
            }

            const valor = parseFloat(valorStr);

            try {
                if (modoEdicaoInvestimentoId) {
                    await updateDoc(doc(db, "investimentos", modoEdicaoInvestimentoId), {
                        descricao: desc,
                        valor
                    });
                    modoEdicaoInvestimentoId = null;
                    avisar("Investimento atualizado!");
                } else {
                    await addDoc(collection(db, "investimentos"), {
                        descricao: desc,
                        valor
                    });
                    avisar("Investimento salvo!");
                }
                abaAtiva = "investimentos";
                renderizarTela();
            } catch (e) {
                console.error("Erro ao salvar investimento:", e);
                avisar("Erro ao salvar investimento.", true);
            }
        }

        window.confirmarExclusaoItem = async function() {
            if (!itemSelecionado) return;
            const id = itemSelecionado.firestoreId;
            itemSelecionado = null;
            try {
                await deleteDoc(doc(db, "lancamentos", id));
                avisar("Registro excluído.");
                renderizarTela();
            } catch (e) {
                avisar(`Erro ao excluir (${e.code}).`, true);
                renderizarTela();
            }
        }

        window.confirmarExclusaoInvestimento = async function() {
            if (!itemInvestimentoSelecionado) return;
            const id = itemInvestimentoSelecionado.firestoreId;
            itemInvestimentoSelecionado = null;
            try {
                await deleteDoc(doc(db, "investimentos", id));
                avisar("Investimento excluído.");
                renderizarTela();
            } catch (e) {
                avisar("Erro ao excluir investimento.", true);
                renderizarTela();
            }
        }

        async function verificarEExecutarBackupSemanal() {
            if (lancamentos.length === 0) return;
            const chaveUltimoBackup = "app_financa_ultima_data_backup";
            const ultimoBackupStr = localStorage.getItem(chaveUltimoBackup);
            const agora = Date.now();
            const seteDiasMs = 7 * 24 * 60 * 60 * 1000;

            if (!ultimoBackupStr || (agora - parseInt(ultimoBackupStr, 10)) >= seteDiasMs) {
                await executarBackupNuvem(true);
            }
        }

        window.gerarBackupManual = async function() {
            await executarBackupNuvem(false);
            carregarBackupsNuvem();
        }

        async function executarBackupNuvem(automatico = true) {
            try {
                const dataIso = new Date().toISOString();
                const dadosBackup = lancamentos.map(l => {
                    const copia = { ...l };
                    delete copia.firestoreId;
                    return copia;
                });

                await setDoc(doc(db, "backups", dataIso), {
                    data: dataIso,
                    itens: dadosBackup
                });

                localStorage.setItem("app_financa_ultima_data_backup", String(Date.now()));
                if (!automatico) avisar("Backup semanal gerado com sucesso!");
                await limparBackupsAntigos();
            } catch (e) {
                console.error("Erro ao gerar backup:", e);
                if (!automatico) avisar("Erro ao gerar backup na nuvem.", true);
            }
        }

        async function limparBackupsAntigos() {
            try {
                const snap = await getDocs(collection(db, "backups"));
                let docsList = [];
                snap.forEach(d => docsList.push({ id: d.id, ...d.data() }));
                docsList.sort((a, b) => b.id.localeCompare(a.id));

                if (docsList.length > 5) {
                    for (let i = 5; i < docsList.length; i++) {
                        await deleteDoc(doc(db, "backups", docsList[i].id));
                    }
                }
            } catch (e) {
                console.error("Erro ao limpar backups antigos:", e);
            }
        }

        async function carregarBackupsNuvem() {
            try {
                const snap = await getDocs(collection(db, "backups"));
                backupsNuvem = [];
                snap.forEach(d => backupsNuvem.push({ id: d.id, ...d.data() }));
                backupsNuvem.sort((a, b) => b.id.localeCompare(a.id));
                if (abaAtiva === "configurar") renderizarTela();
            } catch (e) {
                console.error("Erro ao carregar lista de backups:", e);
            }
        }

        window.restaurarBackupNuvem = async function(backupId) {
            if (!confirm(`Deseja restaurar o backup de ${formatardataIsoBr(backupId)}? Os dados atuais serão substituídos.`)) return;
            try {
                const alvo = backupsNuvem.find(b => b.id === backupId);
                if (!alvo || !alvo.itens) {
                    avisar("Backup não encontrado.", true);
                    return;
                }

                const snapAtuais = await getDocs(collection(db, "lancamentos"));
                for (const d of snapAtuais.docs) {
                    await deleteDoc(doc(db, "lancamentos", d.id));
                }

                for (const item of alvo.itens) {
                    await addDoc(collection(db, "lancamentos"), item);
                }

                avisar("Backup restaurado com sucesso!");
                mudarAba("principal");
            } catch (e) {
                console.error("Erro ao restaurar backup:", e);
                avisar("Erro ao restaurar backup.", true);
            }
        }

        window.exportarExcel = function() {
            if (lancamentos.length === 0) {
                avisar("Nenhum dado para exportar.", true);
                return;
            }
            const dadosExcel = lancamentos.map(l => ({
                "Ano-Mês": formatarMesBr(l.ano_mes),
                Tipo: l.tipo,
                Descrição: l.descricao,
                Valor: l.valor,
                Fixo: l.fixo ? 1 : 0,
                "Forma de Pagamento": l.forma_pagamento || "",
                Pago: l.pago ? "Sim" : "Não"
            }));

            const worksheet = XLSX.utils.json_to_sheet(dadosExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Lançamentos");
            XLSX.writeFile(workbook, "financas_export.xlsx");
            avisar("Planilha Excel exportada!");
        }

        window.importarExcelPrompt = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx, .xls';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async event => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet);

                        let importados = 0;
                        for (const row of json) {
                            let rawMes = String(row["Ano-Mês"] || row["ano_mes"] || formatarMesBr(mesAtual));
                            let ano_mes = rawMes.includes("-") && rawMes.indexOf("-") === 2 ? formatarMesIso(rawMes) : rawMes;

                            const tipo = String(row["Tipo"] || "Despesa");
                            const descricao = String(row["Descrição"] || row["descricao"] || "Importado");
                            const valor = parseFloat(String(row["Valor"] || 0).replace(",", ".")) || 0;
                            const fixo = parseInt(row["Fixo"] || 0) ? 1 : 0;
                            const forma_pagamento = String(row["Forma de Pagamento"] || row["forma_pagamento"] || "Débito");
                            const pagoStr = String(row["Pago"] || "Não").toLowerCase();
                            const pago = ["1", "true", "sim", "s", "pago"].includes(pagoStr) ? 1 : 0;

                            await addDoc(collection(db, "lancamentos"), {
                                ano_mes,
                                tipo,
                                descricao,
                                valor,
                                fixo,
                                forma_pagamento,
                                pago,
                                ordem: importados
                            });
                            importados++;
                        }
                        renderizarTela();
                        avisar(`${importados} registros importados!`);
                    } catch (ex) {
                        avisar("Erro ao processar planilha Excel.", true);
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        window.exportarBackup = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lancamentos));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "financas_backup.json");
            dlAnchorElem.click();
            avisar("Backup JSON exportado!");
        }

        window.importarBackupPrompt = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async event => {
                    try {
                        const lista = JSON.parse(event.target.result);
                        for (const item of lista) {
                            delete item.firestoreId;
                            await addDoc(collection(db, "lancamentos"), item);
                        }
                        renderizarTela();
                        avisar("Backup JSON restaurado!");
                    } catch (ex) {
                        avisar("Erro ao ler arquivo JSON.", true);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        renderizarTela();

        // Listener Lançamentos
        onSnapshot(collection(db, "lancamentos"), (snapshot) => {
            lancamentos = [];
            snapshot.forEach((d) => {
                lancamentos.push({ firestoreId: d.id, ...d.data() });
            });
            renderizarTela();
            verificarEExecutarBackupSemanal();
            carregarBackupsNuvem();
        }, (error) => {
            console.error("Erro Firebase:", error);
            avisar(`Erro Firebase (${error.code}).`, true);
        });

        // Listener Investimentos
        onSnapshot(collection(db, "investimentos"), (snapshot) => {
            investimentos = [];
            snapshot.forEach((d) => {
                investimentos.push({ firestoreId: d.id, ...d.data() });
            });
            renderizarTela();
        }, (error) => {
            console.error("Erro Firebase Investimentos:", error);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.warn('Service Worker não registrado:', err);
                });
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            avisar("Aplicativo pronto para instalar na aba Configurar!");
        });

        window.instalarApp = async function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    avisar("Aplicativo instalado!");
                }
                deferredPrompt = null;
            } else {
                avisar("Use o menu do navegador > 'Instalar aplicativo'.", false);
            }
        }
    </script>
</body>
</html>
